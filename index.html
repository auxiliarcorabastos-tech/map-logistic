<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAP LOGISTICS</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
overflow:hidden;
background:#f5f5f5;
}

.sidebar{
width:400px;
background:white;
padding:15px;
overflow-y:auto;
border-right:1px solid #ddd;
z-index:1000;
}

#map{
flex:1;
height:100vh;
}

h1{
color:#2d89ef;
margin-bottom:10px;
}

.instrucciones{
font-size:13px;
background:#f8f8f8;
padding:12px;
border-radius:10px;
line-height:1.5;
margin-bottom:15px;
color:#555;
}

.form-group{
margin-bottom:12px;
position:relative;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
textarea,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:14px;
}

textarea{
height:70px;
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

.btn-primary{
background:#2d89ef;
color:white;
}

.btn-success{
background:#28a745;
color:white;
}

#sugerencias{
background:white;
border:1px solid #ccc;
border-radius:8px;
margin-top:5px;
max-height:250px;
overflow-y:auto;
position:absolute;
width:100%;
z-index:99999;
}

.sugerencia-item{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.sugerencia-item:hover{
background:#f2f2f2;
}

.pedido{
background:#fafafa;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
cursor:pointer;
}

.estado{
margin-top:8px;
font-weight:bold;
color:green;
}

@media(max-width:768px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
height:45vh;
border-right:none;
border-bottom:1px solid #ddd;
}

#map{
height:55vh;
}

}

</style>

</head>

<body>

<div class="sidebar">

<h1>🚚 MAP LOGISTICS</h1>

<div class="instrucciones">

📌 <b>INSTRUCCIONES</b><br><br>

1. Busca barrios, colegios, parques o direcciones.<br>
2. También puedes tocar directamente el mapa.<br>
3. Guarda pedidos.<br>
4. Optimiza rutas automáticamente.<br>
5. Usa GPS, llamadas y WhatsApp.

</div>

<div class="form-group">

<label>Departamento</label>

<select id="departamento">

<option value="Cundinamarca">
Cundinamarca
</option>

<option value="Antioquia">
Antioquia
</option>

<option value="Boyacá">
Boyacá
</option>

</select>

</div>

<div class="form-group">

<label>Municipio / Ciudad</label>

<input
type="text"
id="municipio"
value="Bogotá"
/>

</div>

<div class="form-group">

<label>Barrio</label>

<input
type="text"
id="barrio"
/>

</div>

<div class="form-group">

<label>Dirección</label>

<input
type="text"
id="direccion"
placeholder="Ej: Corabastos"
onkeyup="buscarSugerencias()"
/>

<div id="sugerencias"></div>

</div>

<div class="form-group">

<label>Cliente</label>

<input
type="text"
id="cliente"
/>

</div>

<div class="form-group">

<label>Teléfono</label>

<input
type="tel"
id="telefono"
maxlength="10"
placeholder="3001234567"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"
/>

</div>

<div class="form-group">

<label>Observaciones</label>

<textarea id="observaciones"></textarea>

</div>

<button
class="btn-primary"
onclick="guardarPedido()"
>
💾 Guardar Pedido
</button>

<button
class="btn-success"
onclick="optimizarRuta()"
>
🛣️ Optimizar Ruta
</button>

<div class="form-group">

<label>
Último destino
</label>

<select id="ultimoDestino">

<option value="">
Automático
</option>

</select>

</div>

<div id="listaPedidos"></div>

</div>

<div id="map"></div>

<script>

// =====================
// MAPA
// =====================

const map = L.map('map').setView(
[4.7110,-74.0721],
12
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

// =====================
// VARIABLES
// =====================

let pedidos = [];
let markers = [];
let rutaLayer = null;

let puntoSeleccionado = null;
let markerSeleccionado = null;

// =====================
// GPS
// =====================

navigator.geolocation.getCurrentPosition(position=>{

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

window.miUbicacion = {
lat,
lon
};

map.setView([lat,lon],13);

L.marker([lat,lon])

.addTo(map)

.bindPopup('📍 Tu ubicación')

.openPopup();

});

// =====================
// BUSCAR DIRECCIONES
// =====================

async function buscarSugerencias(){

const texto =
document.getElementById(
'direccion'
).value.trim();

const contenedor =
document.getElementById(
'sugerencias'
);

if(texto.length < 2){

contenedor.innerHTML='';

return;

}

try{

const municipio =
document.getElementById(
'municipio'
).value || 'Bogotá';

const query =
`${texto} ${municipio} Colombia`;

const response = await fetch(

`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=10`

);

const data =
await response.json();

contenedor.innerHTML='';

if(!data.features ||
!data.features.length){

contenedor.innerHTML=`

<div style="
padding:10px;
color:red;
">

❌ No se encontraron coincidencias

</div>

`;

return;

}

data.features.forEach(lugar=>{

const propiedades =
lugar.properties || {};

const nombre =
`
${propiedades.name || ''}
 ${propiedades.street || ''}
 ${propiedades.city || ''}
`
.trim();

const lat =
lugar.geometry.coordinates[1];

const lon =
lugar.geometry.coordinates[0];

const item =
document.createElement('div');

item.className =
'sugerencia-item';

item.innerHTML =
`📍 ${nombre}`;

item.onclick = ()=>{

seleccionarSugerencia(
nombre,
lat,
lon
);

};

contenedor.appendChild(item);

});

}catch(error){

console.log(error);

contenedor.innerHTML=`

<div style="
padding:10px;
color:red;
">

❌ Error buscando direcciones

</div>

`;

}

}

// =====================
// SELECCIONAR
// =====================

function seleccionarSugerencia(
direccion,
lat,
lon
){

document.getElementById(
'direccion'
).value = direccion;

document.getElementById(
'sugerencias'
).innerHTML='';

puntoSeleccionado = {
lat,
lon
};

if(markerSeleccionado){

map.removeLayer(
markerSeleccionado
);

}

markerSeleccionado =
L.marker([lat,lon])

.addTo(map)

.bindPopup(direccion)

.openPopup();

map.setView([lat,lon],17);

}

// =====================
// CLICK EN MAPA
// =====================

map.on('click', async function(e){

const lat = e.latlng.lat;
const lon = e.latlng.lng;

puntoSeleccionado = {
lat,
lon
};

if(markerSeleccionado){

map.removeLayer(markerSeleccionado);

}

markerSeleccionado =
L.marker([lat,lon])

.addTo(map)

.bindPopup(
'📍 Punto seleccionado'
)

.openPopup();

try{

const response = await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`

);

const data =
await response.json();

if(data.display_name){

document.getElementById(
'direccion'
).value =
data.display_name;

}

}catch(error){

console.log(error);

}

});

// =====================
// GUARDAR PEDIDO
// =====================

function guardarPedido(){

const pedido = {

id:Date.now(),

departamento:
document.getElementById(
'departamento'
).value,

municipio:
document.getElementById(
'municipio'
).value,

barrio:
document.getElementById(
'barrio'
).value,

direccion:
document.getElementById(
'direccion'
).value,

cliente:
document.getElementById(
'cliente'
).value,

telefono:
document.getElementById(
'telefono'
).value,

observaciones:
document.getElementById(
'observaciones'
).value,

lat:puntoSeleccionado?.lat,
lon:puntoSeleccionado?.lon,

estado:'Pendiente'

};

if(!pedido.cliente ||
!pedido.direccion){

alert(
'Completa cliente y dirección'
);

return;

}

if(!pedido.lat){

alert(
'Selecciona una dirección válida'
);

return;

}

pedidos.push(pedido);

guardarStorage();

renderPedidos();

optimizarRuta();

limpiarFormulario();

}

// =====================
// MOSTRAR PEDIDOS
// =====================

function renderPedidos(){

document.getElementById(
'listaPedidos'
).innerHTML='';

markers.forEach(m=>{

map.removeLayer(m);

});

markers=[];

const selectFinal =
document.getElementById(
'ultimoDestino'
);

selectFinal.innerHTML =
'<option value="">Automático</option>';

pedidos.forEach((pedido,index)=>{

const option =
document.createElement('option');

option.value = pedido.id;

option.textContent =
`${pedido.cliente} - ${pedido.direccion}`;

selectFinal.appendChild(option);

const icono =
L.divIcon({

className:'',

html:`

<div style="
background:#2d89ef;
color:white;
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
border:3px solid white;
">

${index+1}

</div>

`

});

const marker =
L.marker(
[pedido.lat,pedido.lon],
{
icon:icono
}
)

.addTo(map)

.bindPopup(`
<b>${index+1}. ${pedido.cliente}</b>
<br>
${pedido.direccion}
`);

markers.push(marker);

const div =
document.createElement('div');

div.className='pedido';

div.onclick=()=>{

map.setView(
[pedido.lat,pedido.lon],
17
);

marker.openPopup();

};

div.innerHTML=`

<h3>
${index+1}. ${pedido.cliente}
</h3>

<p>
📍 ${pedido.direccion}
</p>

<p>
📞 ${pedido.telefono}
</p>

<div class="estado">
${pedido.estado}
</div>

<button onclick="
event.stopPropagation();
abrirRuta(${pedido.lat},${pedido.lon})
">
🚗 Navegar
</button>

<button onclick="
event.stopPropagation();
llamar('${pedido.telefono}')
">
📞 Llamar
</button>

<button onclick="
event.stopPropagation();
enviarWhatsapp(
'${pedido.telefono}',
'${pedido.cliente}'
)
">
💬 WhatsApp
</button>

`;

document.getElementById(
'listaPedidos'
).appendChild(div);

});

}

// =====================
// OPTIMIZAR RUTA REAL
// =====================

async function optimizarRuta(){

if(pedidos.length < 1)return;

if(rutaLayer){

map.removeLayer(
rutaLayer
);

}

let pedidosRuta = [...pedidos];

const ultimoID =
document.getElementById('ultimoDestino')?.value;

if(ultimoID){

const ultimo =
pedidosRuta.find(
p=>p.id == ultimoID
);

pedidosRuta =
pedidosRuta.filter(
p=>p.id != ultimoID
);

if(ultimo){

pedidosRuta.push(ultimo);

}

}

const coords = [];

if(window.miUbicacion){

coords.push(
`${window.miUbicacion.lon},${window.miUbicacion.lat}`
);

}

pedidosRuta.forEach(p=>{

coords.push(
`${p.lon},${p.lat}`
);

});

const url = `
https://router.project-osrm.org/route/v1/driving/
${coords.join(';')}
?overview=full
&geometries=geojson
&steps=true
`;

try{

const response =
await fetch(url);

const data =
await response.json();

if(!data.routes.length){

alert('No se pudo generar la ruta');

return;

}

const ruta =
data.routes[0].geometry.coordinates.map(c=>[
c[1],
c[0]
]);

rutaLayer =
L.polyline(ruta,{
color:'blue',
weight:6
}).addTo(map);

map.fitBounds(
rutaLayer.getBounds()
);

}catch(error){

console.log(error);

alert(
'Error generando ruta'
);

}

}

// =====================
// FUNCIONES
// =====================

function abrirRuta(lat,lon){

window.open(
`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`,
'_blank'
);

}

function llamar(numero){

window.open(`tel:${numero}`);

}

function enviarWhatsapp(
numero,
cliente
){

const mensaje =
encodeURIComponent(

`Hola ${cliente},

Tu pedido va en camino 🚚

MAP LOGISTICS`

);

window.open(
`https://wa.me/57${numero}?text=${mensaje}`,
'_blank'
);

}

// =====================
// STORAGE
// =====================

function guardarStorage(){

localStorage.setItem(
'pedidos',
JSON.stringify(pedidos)
);

}

function limpiarFormulario(){

document.getElementById(
'barrio'
).value='';

document.getElementById(
'direccion'
).value='';

document.getElementById(
'cliente'
).value='';

document.getElementById(
'telefono'
).value='';

document.getElementById(
'observaciones'
).value='';

document.getElementById(
'sugerencias'
).innerHTML='';

puntoSeleccionado=null;

}

const guardados =
localStorage.getItem(
'pedidos'
);

if(guardados){

pedidos =
JSON.parse(guardados);

renderPedidos();

optimizarRuta();

}

</script>

</body>
</html>
