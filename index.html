<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAP LOGISTICS</title>

<!-- PWA -->
<meta name="theme-color" content="#2d89ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
display:flex;
height:100vh;
overflow:hidden;
background:#f5f5f5;
}

/* =========================
   PANEL IZQUIERDO
========================= */

.sidebar{
width:360px;
background:white;
padding:15px;
overflow-y:auto;
border-right:1px solid #ddd;
z-index:1000;
}

h1{
margin-bottom:15px;
color:#2d89ef;
font-size:24px;
}

.form-group{
margin-bottom:10px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:14px;
}

textarea{
resize:none;
height:70px;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

.btn-primary{
background:#2d89ef;
color:white;
}

.btn-success{
background:#28a745;
color:white;
}

/* =========================
   MAPA
========================= */

#map{
flex:1;
height:100vh;
}

/* =========================
   TARJETAS PEDIDOS
========================= */

.pedido{
background:#fafafa;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
cursor:pointer;
transition:0.2s;
}

.estado{
margin-top:8px;
font-weight:bold;
color:green;
}

/* =========================
   RESPONSIVE CELULAR
========================= */

@media(max-width:768px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
height:45vh;
border-right:none;
border-bottom:1px solid #ddd;
}

#map{
width:100%;
height:55vh;
}

button{
font-size:16px;
padding:14px;
}

input,
textarea{
font-size:16px;
}

}

</style>

</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

<h1>🚚 MAP LOGISTICS</h1>

<div class="form-group">
<label>Departamento</label>

<select id="departamento">

<option value="Cundinamarca">
Cundinamarca
</option>

<option value="Boyacá">
Boyacá
</option>

<option value="Antioquia">
Antioquia
</option>

</select>
</div>

<div class="form-group">
<label>Municipio / Ciudad</label>

<input
type="text"
id="municipio"
value="Bogotá"
/>
</div>

<div class="form-group">
<label>Barrio</label>

<input
type="text"
id="barrio"
/>
</div>

<div class="form-group">
<label>Dirección</label>

<input
type="text"
id="direccion"
/>
</div>

<div class="form-group">
<label>Cliente</label>

<input
type="text"
id="cliente"
/>
</div>

<div class="form-group">
<label>Teléfono</label>

<input
type="text"
id="telefono"
/>
</div>

<div class="form-group">
<label>Observaciones</label>

<textarea id="observaciones"></textarea>
</div>

<button
class="btn-primary"
onclick="agregarPedido()"
>
💾 Guardar Pedido
</button>

<button
class="btn-success"
onclick="optimizarRuta()"
>
🛣️ Optimizar Ruta
</button>

<div id="listaPedidos"></div>

</div>

<!-- =========================
     MAPA
========================= -->

<div id="map"></div>

<script>

// =========================
// MAPA
// =========================

const map = L.map('map').setView([4.7110,-74.0721],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

// =========================
// VARIABLES
// =========================

let pedidos = [];
let markers = [];
let rutaLayer = null;

let puntoSeleccionado = null;
let markerSeleccionado = null;

let editandoPedidoId = null;

// =========================
// GPS ACTUAL
// =========================

navigator.geolocation.getCurrentPosition(position=>{

const lat = position.coords.latitude;
const lon = position.coords.longitude;

window.miUbicacion = {
lat,
lon
};

map.setView([lat,lon],13);

L.marker([lat,lon])

.addTo(map)

.bindPopup('📍 Punto inicial')

.openPopup();

});

// =========================
// CLICK EN MAPA
// =========================

map.on('click', async function(e){

const lat = e.latlng.lat;
const lon = e.latlng.lng;

puntoSeleccionado = {
lat,
lon
};

if(markerSeleccionado){
map.removeLayer(markerSeleccionado);
}

markerSeleccionado = L.marker([lat,lon])

.addTo(map)

.bindPopup('📍 Punto seleccionado')

.openPopup();

});

// =========================
// AGREGAR PEDIDO
// =========================

async function agregarPedido(){

const departamento =
document.getElementById('departamento').value;

const municipio =
document.getElementById('municipio').value;

const barrio =
document.getElementById('barrio').value;

const direccion =
document.getElementById('direccion').value;

const cliente =
document.getElementById('cliente').value;

const telefono =
document.getElementById('telefono').value;

const observaciones =
document.getElementById('observaciones').value;

if(!cliente || !direccion){

alert('Completa los campos');

return;

}

let lat;
let lon;

if(puntoSeleccionado){

lat = puntoSeleccionado.lat;
lon = puntoSeleccionado.lon;

}else{

const response = await fetch(

`https://nominatim.openstreetmap.org/search?format=json&q=${direccion},${municipio},${departamento},Colombia`

);

const data = await response.json();

if(!data.length){

alert('Dirección no encontrada');

return;

}

lat = parseFloat(data[0].lat);
lon = parseFloat(data[0].lon);

}

const pedido = {

id:Date.now(),

departamento,
municipio,
barrio,
direccion,
cliente,
telefono,
observaciones,

lat,
lon,

estado:'Pendiente'

};

pedidos.push(pedido);

guardarPedidos();

renderPedidos();

limpiarFormulario();

}

// =========================
// RENDER
// =========================

function renderPedidos(){

document.getElementById(
'listaPedidos'
).innerHTML='';

markers.forEach(m=>map.removeLayer(m));

markers=[];

pedidos.forEach((pedido,index)=>{

const icono = L.divIcon({

html:`

<div style="
background:#2d89ef;
color:white;
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
border:3px solid white;
">

${index+1}

</div>

`,

className:''

});

const marker = L.marker(
[pedido.lat,pedido.lon],
{
icon:icono
}
)

.addTo(map)

.bindPopup(`
<b>${index+1}. ${pedido.cliente}</b>
<br>
${pedido.direccion}
`);

marker.bindTooltip(

`${index+1}. ${pedido.cliente}`,

{
permanent:true,
direction:'top'
}

);

markers.push(marker);

const div = document.createElement('div');

div.className='pedido';

div.innerHTML=`

<h3>${index+1}. ${pedido.cliente}</h3>

<p>📍 ${pedido.direccion}</p>

<p>📞 ${pedido.telefono}</p>

<div class="estado">
${pedido.estado}
</div>

<button onclick="abrirRuta(${pedido.lat},${pedido.lon})">
🚗 Navegar
</button>

<button onclick="marcarEntregado(
${pedido.id},
'${pedido.telefono}',
'${pedido.cliente}'
)">
✅ Pedido Entregado
</button>

`;

document
.getElementById('listaPedidos')
.appendChild(div);

});

}

// =========================
// OPTIMIZAR RUTA
// =========================

async function optimizarRuta(){

if(pedidos.length < 1){

alert('Agrega pedidos');

return;

}

let puntosRuta = [];

if(window.miUbicacion){

puntosRuta.push(
`${window.miUbicacion.lon},${window.miUbicacion.lat}`
);

}

pedidos.forEach(p=>{

puntosRuta.push(`${p.lon},${p.lat}`);

});

const coordenadas = puntosRuta.join(';');

const response = await fetch(

`https://router.project-osrm.org/route/v1/driving/${coordenadas}?overview=full&geometries=geojson`

);

const data = await response.json();

if(rutaLayer){

map.removeLayer(rutaLayer);

}

const route =
data.routes[0].geometry.coordinates;

const latlngs =
route.map(c=>[c[1],c[0]]);

rutaLayer = L.polyline(
latlngs,
{
color:'blue',
weight:5
}
).addTo(map);

map.fitBounds(
rutaLayer.getBounds()
);

}

// =========================
// NAVEGAR
// =========================

function abrirRuta(lat,lon){

window.open(

`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`,

'_blank'

);

}

// =========================
// ENTREGADO
// =========================

function marcarEntregado(id,telefono,cliente){

const pedido = pedidos.find(
p=>p.id===id
);

pedido.estado='ENTREGADO ✅';

guardarPedidos();

renderPedidos();

const mensaje = encodeURIComponent(

`Hola ${cliente},

Tu pedido ha sido entregado con satisfacción ✅🚚

Gracias por confiar en MAP LOGISTICS.`

);

window.open(

`https://wa.me/57${telefono}?text=${mensaje}`,

'_blank'

);

}

// =========================
// STORAGE
// =========================

function guardarPedidos(){

localStorage.setItem(
'pedidos',
JSON.stringify(pedidos)
);

}

function limpiarFormulario(){

document.getElementById('barrio').value='';
document.getElementById('direccion').value='';
document.getElementById('cliente').value='';
document.getElementById('telefono').value='';
document.getElementById('observaciones').value='';

puntoSeleccionado=null;

}

// =========================
// CARGAR
// =========================

const guardados =
localStorage.getItem('pedidos');

if(guardados){

pedidos = JSON.parse(guardados);

renderPedidos();

}

// =========================
// PWA
// =========================

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker
.register('service-worker.js')

.then(()=>{

console.log('PWA activa');

});

});

}

</script>

</body>
</html>
