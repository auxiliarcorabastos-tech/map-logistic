<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAP LOGISTICS</title>

<!-- PWA -->
<meta name="theme-color" content="#2d89ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
height:100vh;
overflow:hidden;
background:#f5f5f5;
}

/* PANEL */

.sidebar{
width:370px;
background:white;
padding:15px;
overflow-y:auto;
border-right:1px solid #ddd;
z-index:1000;
}

#map{
flex:1;
height:100vh;
}

h1{
margin-bottom:15px;
color:#2d89ef;
font-size:24px;
}

.form-group{
margin-bottom:10px;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:14px;
}

textarea{
resize:none;
height:70px;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

.btn-primary{
background:#2d89ef;
color:white;
}

.btn-success{
background:#28a745;
color:white;
}

.pedido{
background:#fafafa;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
cursor:pointer;
transition:0.2s;
}

.estado{
margin-top:8px;
font-weight:bold;
color:green;
}

.custom-marker{
background:transparent;
border:none;
}

/* RESPONSIVE */

@media(max-width:768px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
height:45vh;
border-right:none;
border-bottom:1px solid #ddd;
}

#map{
width:100%;
height:55vh;
}

button{
font-size:16px;
padding:14px;
}

input,
textarea{
font-size:16px;
}

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h1>🚚 MAP LOGISTICS</h1>

<div class="form-group">
<label>Departamento</label>

<select id="departamento">

<option value="Cundinamarca">
Cundinamarca
</option>

<option value="Boyacá">
Boyacá
</option>

<option value="Antioquia">
Antioquia
</option>

</select>
</div>

<div class="form-group">
<label>Municipio / Ciudad</label>

<input
type="text"
id="municipio"
value="Bogotá"
/>
</div>

<div class="form-group">
<label>Barrio</label>

<input
type="text"
id="barrio"
/>
</div>

<div class="form-group">
<label>Dirección</label>

<input
type="text"
id="direccion"
/>
</div>

<div class="form-group">
<label>Cliente</label>

<input
type="text"
id="cliente"
/>
</div>

<div class="form-group">
<label>Teléfono</label>

<input
type="text"
id="telefono"
/>
</div>

<div class="form-group">
<label>Observaciones</label>

<textarea id="observaciones"></textarea>
</div>

<button
class="btn-primary"
onclick="guardarPedido()"
>
💾 Guardar Pedido
</button>

<button
class="btn-success"
onclick="optimizarRuta()"
>
🛣️ Optimizar Ruta
</button>

<div id="listaPedidos"></div>

</div>

<!-- MAPA -->

<div id="map"></div>

<script>

// =========================
// MAPA
// =========================

const map = L.map('map').setView([4.7110,-74.0721],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

// =========================
// VARIABLES
// =========================

let pedidos = [];
let markers = [];
let rutaLayer = null;

let puntoSeleccionado = null;
let markerSeleccionado = null;

let editandoPedidoId = null;

// =========================
// GPS ACTUAL
// =========================

navigator.geolocation.getCurrentPosition(position=>{

const lat = position.coords.latitude;
const lon = position.coords.longitude;

window.miUbicacion = {
lat,
lon
};

map.setView([lat,lon],13);

L.marker([lat,lon])

.addTo(map)

.bindPopup('📍 Punto inicial')

.openPopup();

});

// =========================
// CLICK EN MAPA
// =========================

map.on('click', async function(e){

const lat = e.latlng.lat;
const lon = e.latlng.lng;

puntoSeleccionado = {
lat,
lon
};

// ELIMINAR MARKER ANTERIOR
if(markerSeleccionado){
map.removeLayer(markerSeleccionado);
}

// CREAR NUEVO MARKER
markerSeleccionado = L.marker([lat,lon])

.addTo(map)

.bindPopup('📍 Punto seleccionado')

.openPopup();

try{

// REVERSE GEOCODING
const response = await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`

);

const data = await response.json();

if(data.address){

const address = data.address;

// DIRECCIÓN
document.getElementById('direccion').value =
data.display_name || '';

// BARRIO
document.getElementById('barrio').value =
address.suburb ||
address.neighbourhood ||
'';

// MUNICIPIO
document.getElementById('municipio').value =
address.city ||
address.town ||
address.village ||
'Bogotá';

// DEPARTAMENTO
document.getElementById('departamento').value =
address.state || 'Cundinamarca';

}

}catch(error){

console.log(error);

}

});

// =========================
// GUARDAR / EDITAR
// =========================

async function guardarPedido(){

const departamento =
document.getElementById('departamento').value;

const municipio =
document.getElementById('municipio').value;

const barrio =
document.getElementById('barrio').value;

const direccion =
document.getElementById('direccion').value;

const cliente =
document.getElementById('cliente').value;

const telefono =
document.getElementById('telefono').value;

const observaciones =
document.getElementById('observaciones').value;

if(!cliente || !direccion){

alert('Completa los campos');

return;

}

let lat;
let lon;

// SI SELECCIONÓ EN MAPA
if(puntoSeleccionado){

lat = puntoSeleccionado.lat;
lon = puntoSeleccionado.lon;

}else{

const response = await fetch(

`https://nominatim.openstreetmap.org/search?format=json&q=${direccion},${municipio},${departamento},Colombia`

);

const data = await response.json();

if(!data.length){

alert('Dirección no encontrada');

return;

}

lat = parseFloat(data[0].lat);
lon = parseFloat(data[0].lon);

}

// EDITAR
if(editandoPedidoId){

const pedido = pedidos.find(
p=>p.id===editandoPedidoId
);

pedido.departamento = departamento;
pedido.municipio = municipio;
pedido.barrio = barrio;
pedido.direccion = direccion;
pedido.cliente = cliente;
pedido.telefono = telefono;
pedido.observaciones = observaciones;
pedido.lat = lat;
pedido.lon = lon;

editandoPedidoId = null;

}else{

const pedido = {

id:Date.now(),

departamento,
municipio,
barrio,
direccion,
cliente,
telefono,
observaciones,

lat,
lon,

estado:'Pendiente'

};

pedidos.push(pedido);

}

guardarStorage();

renderPedidos();

limpiarFormulario();

}

// =========================
// RENDER
// =========================

function renderPedidos(){

document.getElementById(
'listaPedidos'
).innerHTML='';

markers.forEach(m=>map.removeLayer(m));

markers=[];

pedidos.forEach((pedido,index)=>{

const icono = L.divIcon({

className:'custom-marker',

html:`

<div style="
background:#2d89ef;
color:white;
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
border:3px solid white;
">

${index+1}

</div>

`,

iconSize:[35,35]

});

const marker = L.marker(
[pedido.lat,pedido.lon],
{
icon:icono
}
)

.addTo(map)

.bindPopup(`
<b>${index+1}. ${pedido.cliente}</b>
<br>
${pedido.direccion}
`);

marker.bindTooltip(

`${index+1}. ${pedido.cliente}`,

{
permanent:true,
direction:'top'
}

);

// CLICK EN MAPA = SELECCIONAR TARJETA

marker.on('click',()=>{

const tarjeta =
document.getElementById(
`pedido-${pedido.id}`
);

if(tarjeta){

document.querySelectorAll('.pedido')
.forEach(el=>{

el.style.border='1px solid #ddd';
el.style.background='#fafafa';

});

tarjeta.style.border='3px solid #2d89ef';
tarjeta.style.background='#eaf4ff';

tarjeta.scrollIntoView({

behavior:'smooth',
block:'center'

});

}

});

markers.push(marker);

const div = document.createElement('div');

div.className='pedido';

div.id=`pedido-${pedido.id}`;

// CLICK EN TARJETA = IR AL MAPA

div.onclick=()=>{

map.setView([pedido.lat,pedido.lon],17);

marker.openPopup();

document.querySelectorAll('.pedido')
.forEach(el=>{

el.style.border='1px solid #ddd';
el.style.background='#fafafa';

});

div.style.border='3px solid #2d89ef';
div.style.background='#eaf4ff';

};

div.innerHTML=`

<h3>${index+1}. ${pedido.cliente}</h3>

<p>📍 ${pedido.direccion}</p>

<p>📞 ${pedido.telefono}</p>

<div class="estado">
${pedido.estado}
</div>

<button onclick="
event.stopPropagation();
abrirRuta(${pedido.lat},${pedido.lon})
">
🚗 Navegar
</button>

<button onclick="
event.stopPropagation();
llamar('${pedido.telefono}')
">
📞 Llamar
</button>

<button onclick="
event.stopPropagation();
enviarWhatsapp(
'${pedido.telefono}',
'${pedido.cliente}'
)
">
💬 WhatsApp
</button>

<button
style="background:#28a745;color:white;"
onclick="
event.stopPropagation();
marcarEntregado(
${pedido.id},
'${pedido.telefono}',
'${pedido.cliente}'
)
"
>
✅ Pedido Entregado
</button>

<button
style="background:#ffc107;color:black;"
onclick="
event.stopPropagation();
editarPedido(${pedido.id})
"
>
✏️ Editar
</button>

<button
style="background:#dc3545;color:white;"
onclick="
event.stopPropagation();
eliminarPedido(${pedido.id})
"
>
🗑️ Eliminar
</button>

`;

document
.getElementById('listaPedidos')
.appendChild(div);

});

}

// =========================
// LLAMAR
// =========================

function llamar(numero){

window.open(`tel:${numero}`);

}

// =========================
// WHATSAPP
// =========================

function enviarWhatsapp(numero,cliente){

const mensaje = encodeURIComponent(

`Hola ${cliente},

Tu pedido va en camino 🚚

MAP LOGISTICS`

);

window.open(

`https://wa.me/57${numero}?text=${mensaje}`,

'_blank'

);

}

// =========================
// ENTREGADO
// =========================

function marcarEntregado(id,telefono,cliente){

const pedido = pedidos.find(
p=>p.id===id
);

pedido.estado='ENTREGADO ✅';

guardarStorage();

renderPedidos();

const mensaje = encodeURIComponent(

`Hola ${cliente},

Tu pedido ha sido entregado con satisfacción ✅🚚

Gracias por confiar en MAP LOGISTICS.`

);

window.open(

`https://wa.me/57${telefono}?text=${mensaje}`,

'_blank'

);

}

// =========================
// EDITAR
// =========================

function editarPedido(id){

const pedido = pedidos.find(
p=>p.id===id
);

if(!pedido)return;

editandoPedidoId=id;

document.getElementById('departamento').value =
pedido.departamento;

document.getElementById('municipio').value =
pedido.municipio;

document.getElementById('barrio').value =
pedido.barrio;

document.getElementById('direccion').value =
pedido.direccion;

document.getElementById('cliente').value =
pedido.cliente;

document.getElementById('telefono').value =
pedido.telefono;

document.getElementById('observaciones').value =
pedido.observaciones;

map.setView([pedido.lat,pedido.lon],17);

}

// =========================
// ELIMINAR
// =========================

function eliminarPedido(id){

const confirmar = confirm(
'¿Eliminar pedido?'
);

if(!confirmar)return;

pedidos = pedidos.filter(
p=>p.id!==id
);

guardarStorage();

renderPedidos();

if(rutaLayer){

map.removeLayer(rutaLayer);

rutaLayer=null;

}

}

// =========================
// OPTIMIZAR RUTA
// =========================

async function optimizarRuta(){

if(pedidos.length < 1){

alert('Agrega pedidos');

return;

}

let puntosRuta = [];

// GPS INICIAL
if(window.miUbicacion){

puntosRuta.push(
`${window.miUbicacion.lon},${window.miUbicacion.lat}`
);

}

// PEDIDOS
pedidos.forEach(p=>{

puntosRuta.push(`${p.lon},${p.lat}`);

});

const coordenadas = puntosRuta.join(';');

try{

const response = await fetch(

`https://router.project-osrm.org/route/v1/driving/${coordenadas}?overview=full&geometries=geojson`

);

const data = await response.json();

if(rutaLayer){

map.removeLayer(rutaLayer);

}

const route =
data.routes[0].geometry.coordinates;

const latlngs =
route.map(c=>[c[1],c[0]]);

rutaLayer = L.polyline(
latlngs,
{
color:'blue',
weight:5
}
).addTo(map);

map.fitBounds(
rutaLayer.getBounds()
);

}catch(error){

console.log(error);

alert('No se pudo generar la ruta');

}

}

// =========================
// NAVEGAR
// =========================

function abrirRuta(lat,lon){

window.open(

`https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`,

'_blank'

);

}

// =========================
// STORAGE
// =========================

function guardarStorage(){

localStorage.setItem(
'pedidos',
JSON.stringify(pedidos)
);

}

// =========================
// LIMPIAR
// =========================

function limpiarFormulario(){

document.getElementById('barrio').value='';
document.getElementById('direccion').value='';
document.getElementById('cliente').value='';
document.getElementById('telefono').value='';
document.getElementById('observaciones').value='';

puntoSeleccionado=null;

}

// =========================
// CARGAR STORAGE
// =========================

const guardados =
localStorage.getItem('pedidos');

if(guardados){

pedidos = JSON.parse(guardados);

renderPedidos();

}

// =========================
// PWA
// =========================

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker
.register('service-worker.js')

.then(()=>{

console.log('PWA activa');

});

});

}

</script>

</body>
</html>
